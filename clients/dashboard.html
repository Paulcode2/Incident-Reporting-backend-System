<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Incident Reporting Dashboard</h1>

    <hr>

    <div>

        <button id="logoutBtn">

            Logout

        </button>

    </div>

    <hr>

    <h2>Report New Incident</h2>

    <form id="incidentForm">

        <div>

            <label>Incident Title</label>

            <br>

            <input
                type="text"
                id="title"
                placeholder="Enter incident title">

        </div>

        <br>

        <div>

            <label>Description</label>

            <br>

            <textarea
                id="description"
                rows="5"
                cols="40"
                placeholder="Describe the incident"></textarea>

        </div>

        <br>

        <div>

            <label>Incident Image</label>

            <br>

            <input
                type="file"
                id="image"
                accept="image/*">

        </div>

        <br>

        <button type="submit">

            Submit Report

        </button>

    </form>

    <hr>

    <h2>All Incidents</h2>

    <div id="incidentContainer">

    </div>

    <script src="config.js"></script>

    <script src="dashboard.js"></script>

</body>

</html>
